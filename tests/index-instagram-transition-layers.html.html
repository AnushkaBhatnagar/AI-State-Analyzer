<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        .phone {
            width: 375px;
            height: 812px;
            background: #000;
            border-radius: 40px;
            padding: 20px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 25px;
            position: relative;
            overflow: hidden;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px 20px;
            border-bottom: 1px solid #333;
        }

        .app-title {
            color: white;
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .notification-counter {
            background: #ff3333;
            color: white;
            border-radius: 15px;
            padding: 5px 12px;
            font-size: 14px;
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        .content-area {
            padding: 20px;
            height: calc(100% - 120px);
            overflow: hidden;
        }

        .notification {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            color: white;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            animation: slideIn 0.5s ease-out;
        }

        .notification:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.15);
        }

        .notification.dark {
            background: rgba(255, 0, 0, 0.2);
            border-color: #ff3333;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.3);
        }

        .notification.hell {
            background: linear-gradient(135deg, rgba(130, 0, 0, 0.75), rgba(60, 0, 0, 0.9));
            border-color: rgba(255, 50, 0, 0.75);
            box-shadow: 0 0 20px rgba(255, 40, 0, 0.65), 0 0 45px rgba(120, 0, 0, 0.55), inset 0 0 10px rgba(255, 0, 0, 0.18);
            animation: hellShake 0.22s infinite, slideIn 0.2s ease-out;
        }

        @keyframes hellShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            18%       { transform: translate(-4px, -2px) rotate(-0.7deg); }
            36%       { transform: translate(4px, 2px) rotate(0.7deg); }
            54%       { transform: translate(-3px, 3px) rotate(-0.4deg); }
            72%       { transform: translate(3px, -2px) rotate(0.4deg); }
            90%       { transform: translate(-1px, 1px) rotate(-0.2deg); }
        }

        .notification.urgent {
            background: linear-gradient(45deg, #ff4444, #cc0000);
            border-color: #ff0000;
            box-shadow: 0 0 25px rgba(255, 68, 68, 0.6);
            animation: urgentPulse 1s infinite, slideIn 0.5s ease-out;
        }

        .notification.reward {
            background: linear-gradient(45deg, #00ff88, #00cc44);
            border-color: #00ff00;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
            animation: celebration 0.8s ease-out, slideIn 0.5s ease-out;
        }

        .notification.mystery {
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
            border-color: #9b59b6;
            box-shadow: 0 0 25px rgba(155, 89, 182, 0.6);
            animation: mysteryPulse 1.5s infinite, slideIn 0.5s ease-out;
        }

        .notification.jackpot {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            border-color: #f39c12;
            box-shadow: 0 0 30px rgba(243, 156, 18, 0.8);
            animation: jackpotCelebration 1s ease-out, slideIn 0.5s ease-out;
        }

        .notification-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            display: flex;
            align-items: center;
            justify-content: center;
            float: left;
            margin-right: 15px;
            font-size: 18px;
        }

        .notification-text {
            font-size: 14px;
            line-height: 1.4;
        }

        .notification-time {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .countdown-timer {
            position: absolute;
            top: 5px;
            right: 10px;
            background: #ff0000;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: bold;
            animation: pulse 0.5s infinite;
        }

        .pulsing-glow {
            animation: glowPulse 2s infinite;
        }

        .flood-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(139, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }

        .flood-text {
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            animation: flicker 0.5s infinite;
        }

        .start-button {
            background: linear-gradient(135deg, #ffb7c5 0%, #ff8fab 50%, #ffb347 100%);
            color: white;
            border: none;
            padding: 16px 36px;
            border-radius: 50px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            letter-spacing: 0.2px;
            box-shadow: 0 8px 24px rgba(255, 143, 171, 0.45), 0 2px 8px rgba(255, 143, 171, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: buttonBreath 3s ease-in-out infinite;
        }

        .start-button:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 12px 32px rgba(255, 143, 171, 0.6), 0 4px 12px rgba(255, 143, 171, 0.3);
        }

        @keyframes buttonBreath {
            0%, 100% { box-shadow: 0 8px 24px rgba(255, 143, 171, 0.45), 0 2px 8px rgba(255, 143, 171, 0.2); }
            50% { box-shadow: 0 10px 30px rgba(255, 143, 171, 0.65), 0 4px 12px rgba(255, 143, 171, 0.35); }
        }


        .warning-text {
            color: #ff6b6b;
            font-size: 12px;
            text-align: center;
            margin-top: 20px;
            opacity: 0.8;
        }

        .escape-button {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            cursor: not-allowed;
            transition: all 0.3s ease;
            display: none;
            opacity: 0.5;
        }

        .escape-button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .escape-button.enabled {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            opacity: 1;
        }

        .escape-button.enabled:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .tap-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }

        .notification.bouncing {
            animation: bounce 0.5s ease-in-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes urgentPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(255, 68, 68, 0.6); }
            50% { transform: scale(1.02); box-shadow: 0 0 35px rgba(255, 68, 68, 0.9); }
        }

        @keyframes celebration {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        @keyframes mysteryPulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        @keyframes jackpotCelebration {
            0% { transform: scale(1) rotate(0deg); }
            25% { transform: scale(1.2) rotate(5deg); }
            50% { transform: scale(1.1) rotate(-5deg); }
            75% { transform: scale(1.15) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
            50% { box-shadow: 0 0 40px rgba(255, 255, 255, 0.8); }
        }

        /* Warm Stage 1 styles */
        .screen.warm-stage {
            background: linear-gradient(180deg, #2d1b2e 0%, #1a0f1e 100%);
        }

        .screen.warm-stage .app-header {
            border-bottom-color: rgba(255, 182, 147, 0.3);
        }

        .screen.warm-stage .app-title {
            background: linear-gradient(45deg, #ff9a9e, #fad0c4);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .screen.warm-stage .notification-counter {
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            animation: warmPulse 1.5s ease-in-out infinite;
        }

        .notification.warm {
            background: rgba(255, 182, 193, 0.15);
            border: 1px solid rgba(255, 182, 193, 0.35);
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(255, 154, 158, 0.15);
            animation: warmSlideIn 0.5s ease-out;
        }

        .notification.warm:hover {
            background: rgba(255, 182, 193, 0.25);
            box-shadow: 0 6px 20px rgba(255, 154, 158, 0.25);
            transform: scale(1.03);
        }

        .notification.warm .notification-icon {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            box-shadow: 0 2px 8px rgba(255, 154, 158, 0.4);
        }

        .notification.warm .notification-text {
            color: #ffe0e6;
        }

        .notification.warm .notification-time {
            color: rgba(255, 182, 193, 0.7);
        }

        @keyframes warmPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 154, 158, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 10px 3px rgba(255, 154, 158, 0.2); }
        }

        @keyframes warmSlideIn {
            from {
                transform: translateY(-30px) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Heart emoji burst animation */
        .heart-float {
            position: fixed;
            pointer-events: none;
            font-size: 20px;
            z-index: 9999;
            animation: heartBurst var(--duration) ease-out forwards;
        }

        @keyframes heartBurst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5) rotate(0deg);
            }
            30% {
                opacity: 1;
                transform: translate(var(--tx), var(--ty)) scale(1.2) rotate(var(--rot));
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx-end), var(--ty-end)) scale(0.3) rotate(var(--rot-end));
            }
        }

        /* Stress Stage 2 styles */
        /* Note: background is set via JS animateStressBackground() for smooth gradient transition */
        .screen.stress-stage .app-header {
            border-bottom-color: rgba(180, 80, 120, 0.35);
            transition: border-bottom-color 6s ease;
        }

        .screen.stress-stage .app-title {
            background: linear-gradient(45deg, #c96090, #9060c0);
            -webkit-background-clip: text;
            background-clip: text;
            transition: filter 8s ease;
        }

        .screen.stress-stage .notification-counter {
            background: linear-gradient(45deg, #c06090, #9050b0);
            animation: anxietyCounterPulse 2s ease-in-out infinite;
            transition: background 6s ease;
        }

        @keyframes anxietyCounterPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50%       { transform: scale(1.06); opacity: 1; }
        }

        /* Anxiety notifications — muted, slightly cool */
        .notification.anxiety {
            background: rgba(100, 80, 120, 0.18);
            border: 1px solid rgba(140, 100, 160, 0.3);
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(80, 60, 100, 0.15);
        }

        .notification.anxiety .notification-icon {
            background: linear-gradient(135deg, #7a6090, #504070);
            box-shadow: 0 2px 6px rgba(80, 60, 120, 0.3);
        }

        .notification.anxiety .notification-text { color: #d8cce8; }
        .notification.anxiety .notification-time { color: rgba(180, 160, 200, 0.6); font-style: italic; }

        .screen.stress-stage .notification.dark {
            background: rgba(180, 40, 60, 0.18);
            border-color: rgba(200, 60, 80, 0.45);
            box-shadow: 0 0 12px rgba(180, 50, 70, 0.2);
            transition: background 4s ease, border-color 4s ease;
        }

        .screen.stress-stage .notification.dark .notification-icon {
            background: linear-gradient(135deg, #b03050, #802040);
        }

        .screen.stress-stage .notification.urgent {
            background: linear-gradient(45deg, #cc2840, #aa3060);
            border-color: #cc3050;
            box-shadow: 0 0 18px rgba(200, 50, 80, 0.55), 0 0 30px rgba(150, 30, 60, 0.25);
            animation: anxietyUrgent 0.6s ease-in-out infinite, slideIn 0.5s ease-out;
        }

        @keyframes anxietyUrgent {
            0%, 100% { transform: scale(1); }
            50%       { transform: scale(1.015); }
        }

        .screen.stress-stage .notification.mystery {
            background: linear-gradient(45deg, #5a20a0, #9020a0);
            border-color: #8040c0;
            box-shadow: 0 0 16px rgba(120, 40, 180, 0.5);
        }

        @keyframes stressCounterPulse {
            0%, 100% { transform: scale(1); background: #ff0000; }
            50% { transform: scale(1.15); background: #ff4400; }
        }

        @keyframes stressUrgent {
            0% { transform: translateX(0) scale(1); }
            25% { transform: translateX(-3px) scale(1.01); }
            50% { transform: translateX(3px) scale(0.99); }
            75% { transform: translateX(-1px) scale(1.01); }
            100% { transform: translateX(0) scale(1); }
        }

        /* Eyeball burst animation */
        .eye-float {
            position: fixed;
            pointer-events: none;
            font-size: 20px;
            z-index: 9999;
            animation: eyeBurst var(--duration) linear forwards;
        }

        @keyframes eyeBurst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1.5) rotate(0deg);
            }
            15% {
                opacity: 1;
                transform: translate(var(--tx), var(--ty)) scale(0.6) rotate(var(--rot));
            }
            30% {
                opacity: 1;
                transform: translate(calc(var(--tx) * 0.5), calc(var(--ty) * 0.5)) scale(1.3) rotate(calc(var(--rot) * -1));
            }
            50% {
                opacity: 0.9;
                transform: translate(var(--tx-end), calc(var(--ty-end) * 0.5)) scale(0.8) rotate(var(--rot-end));
            }
            70% {
                opacity: 0.7;
                transform: translate(calc(var(--tx-end) * 0.7), var(--ty-end)) scale(1.1) rotate(calc(var(--rot-end) * -0.5));
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx-end), var(--ty-end)) scale(0.2) rotate(var(--rot-end));
            }
        }

        /* Hell Mode — Notifications escape the phone */
        .notif-escape {
            position: fixed;
            background: linear-gradient(135deg, rgba(110, 0, 0, 0.93), rgba(50, 0, 0, 0.97));
            border: 1px solid rgba(255, 50, 0, 0.75);
            border-radius: 10px;
            padding: 7px 12px 7px 9px;
            color: #ff9090;
            font-size: 10px;
            font-weight: 700;
            pointer-events: none;
            z-index: 8500;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 14px rgba(255, 40, 0, 0.7), 0 0 30px rgba(120, 0, 0, 0.55);
            white-space: nowrap;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            animation: escapeNotif var(--duration) ease-out forwards;
        }

        @keyframes escapeNotif {
            0% {
                opacity: 0;
                transform: translate(0, 0) rotate(0deg) scale(0.6);
            }
            8% {
                opacity: 1;
                transform: translate(calc(var(--ex) * 0.08), calc(var(--ey) * 0.08)) rotate(var(--rot1)) scale(1.2);
            }
            35% {
                opacity: 1;
                transform: translate(calc(var(--ex) * 0.5), calc(var(--ey) * 0.5)) rotate(var(--rot2)) scale(0.9);
            }
            100% {
                opacity: 0;
                transform: translate(var(--ex), var(--ey)) rotate(var(--rot-end)) scale(0.2);
            }
        }

        /* Hell notification slam entrance */
        @keyframes hellSlam {
            0%   { transform: translateY(-80px) rotate(-7deg) scale(1.2); opacity: 0; filter: brightness(2.5); }
            20%  { transform: translateY(14px) rotate(4deg) scale(1.1); opacity: 1; filter: brightness(1.8); }
            40%  { transform: translateY(-7px) rotate(-2.5deg) scale(0.96); filter: brightness(1.3); }
            60%  { transform: translateY(4px) rotate(1.5deg); filter: brightness(1.1); }
            80%  { transform: translateY(-2px) rotate(-0.5deg); filter: brightness(1); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        .notification.hell-enter {
            animation: hellSlam 0.28s cubic-bezier(0.22, 1, 0.36, 1) !important;
        }

        /* Stage 2 — Aggressive sensory effects */

        /* Phone shake */
        @keyframes phoneShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            12%  { transform: translate(-5px, -2px) rotate(-0.6deg); }
            24%  { transform: translate(5px, 3px) rotate(0.6deg); }
            36%  { transform: translate(-4px, 4px) rotate(-0.4deg); }
            48%  { transform: translate(4px, -3px) rotate(0.4deg); }
            60%  { transform: translate(-3px, 2px) rotate(-0.2deg); }
            72%  { transform: translate(3px, -2px) rotate(0.2deg); }
            86%  { transform: translate(-1px, 1px) rotate(-0.1deg); }
        }

        .phone.shaking {
            animation: phoneShake 0.35s ease-in-out;
        }

        /* Red screen flash */
        .screen-flash {
            position: absolute;
            inset: 0;
            border-radius: 25px;
            pointer-events: none;
            z-index: 500;
            animation: flashFade 0.4s ease-out forwards;
        }

        @keyframes flashFade {
            0%   { opacity: 1; background: rgba(180, 0, 0, 0.22); }
            50%  { opacity: 0.6; }
            100% { opacity: 0; background: rgba(180, 0, 0, 0); }
        }

        /* Slam-in entrance for stress stage */
        @keyframes slamIn {
            0%   { transform: translateY(-50px) scaleX(1.06); opacity: 0; }
            50%  { transform: translateY(6px) scaleX(0.97); opacity: 1; }
            70%  { transform: translateY(-3px) scaleX(1.01); }
            100% { transform: translateY(0) scaleX(1); }
        }

        .notification.slam-enter {
            animation: slamIn 0.2s cubic-bezier(0.22, 1, 0.36, 1) !important;
        }

        /* Vignette — fades in slowly during Stage 2 */
        .screen.stress-stage::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 25px;
            background: radial-gradient(ellipse at center, transparent 45%, rgba(80, 20, 80, 0.5) 100%);
            pointer-events: none;
            z-index: 200;
            animation: vignetteEntrance 10s ease-out forwards, vignetteBreath 1.5s ease-in-out 10s infinite;
        }

        @keyframes vignetteEntrance {
            0%   { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes vignetteBreath {
            0%, 100% { opacity: 0.7; }
            50%       { opacity: 1; }
        }

        /* Aggressive hover in stress stage */
        .screen.stress-stage .notification:hover {
            transform: scale(1.04);
            filter: brightness(1.15);
        }

        /* App title glitch — delayed so it doesn't feel abrupt */
        .screen.stress-stage .app-title {
            animation: titleGlitch 4s ease-in-out 12s infinite;
        }

        @keyframes titleGlitch {
            0%, 80%, 100% {
                text-shadow: none;
                clip-path: none;
                transform: skewX(0deg);
            }
            82% {
                text-shadow: 3px 0 rgba(255, 0, 60, 0.9), -3px 0 rgba(0, 200, 255, 0.7);
                transform: skewX(-2deg) translateX(-2px);
            }
            84% {
                text-shadow: -3px 0 rgba(255, 0, 60, 0.9), 3px 0 rgba(0, 200, 255, 0.7);
                transform: skewX(2deg) translateX(2px);
            }
            86% {
                text-shadow: 2px 0 rgba(255, 0, 60, 0.5), -1px 0 rgba(0, 200, 255, 0.4);
                transform: skewX(-1deg);
            }
            88% {
                text-shadow: none;
                transform: skewX(0deg);
            }
        }

        /* Escape button above vignette */
        .escape-button { z-index: 300; }
        .tap-counter { z-index: 300; }

        /* ============================================
           TRANSITION SCREENS between stages
        ============================================ */
        .transition-overlay {
            position: absolute;
            inset: 0;
            border-radius: 25px;
            background: linear-gradient(160deg, #1a0d2e 0%, #0d0a1e 100%);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 28px 22px;
            text-align: center;
        }

        .transition-overlay.visible {
            display: flex;
            animation: overlayFadeIn 0.4s ease-out;
        }

        .trap-bell {

        @keyframes trapRing {
            0%, 100% { transform: rotate(0deg); }

        /* ✨ Easter egg — The Reflection notification */
        .notification.reflection {

            animation: reflectionShimmer 2.5s ease-in-out infinite, warmSlideIn 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .notification.reflection::before {
            content: '';
            position: absolute;
            top: -50%; left: -75%;
            width: 50%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.09), transparent);

        .notification.reflection .notification-icon {

        .notification.reflection .notification-text { color: #fff8e7; }

        @keyframes reflectionShimmer {
            0%, 100% { box-shadow: 0 0 22px rgba(255,200,100,0.25), 0 0 0 1px rgba(255,200,150,0.35); }
            33%       { box-shadow: 0 0 26px rgba(255,150,200,0.35), 0 0 0 1px rgba(255,150,200,0.45); }
            66%       { box-shadow: 0 0 26px rgba(150,200,255,0.35), 0 0 0 1px rgba(150,200,255,0.45); }
        }

        @keyframes reflectionSweep {
            0%   { left: -75%; }
            100% { left: 125%; }
        }

        /* ✨ Easter egg — Reflection overlay */
        .reflection-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;

        @keyframes overlayFadeIn {

            to   { opacity: 1; transform: scale(1); }
        }

        .reflection-mirror-emoji {
            font-size: 44px;

        .reflection-title {

        function createCountdownTimer(seconds) {
            var timer = document.createElement('div');
            timer.className = 'countdown-timer';
            timer.textContent = seconds;
            
            var countdown = setInterval(function() {
                seconds--;
                timer.textContent = seconds;
                if (seconds <= 0) {
                    clearInterval(countdown);
                    timer.textContent = 'EXPIRED';
                    timer.style.background = '#666';
                }
            }, 1000);
            
            return { timer: timer, countdown: countdown };
        }

        function handleNotificationClick(notification, notif, className) {

                    warmTapCount++;

                        easterEggTriggered = true;
                        setTimeout(spawnReflectionNotification, 600);

                var cx2 = rect2.left + rect2.width / 2;
                var cy2 = rect2.top + rect2.height / 2;
                spawnEyeBurst(cx2, cy2);
            }

            if (!isHellMode) {
                if (className === 'mystery') {
                    handleMysteryClick(notification);
                } else if (className === 'urgent') {
                    handleUrgentClick(notification);
                } else if (notif.text.indexOf('Mystery') !== -1 || notif.text.indexOf('Fortune') !== -1 || notif.text.indexOf('Surprise') !== -1) {
                    handleMysteryClick(notification);
                } else {
                    notification.style.opacity = '0.5';
                    setTimeout(function() {
                        if (notification.parentNode) notification.remove();
                    }, 300);
                }
                
                if (Math.random() < 0.15 && stage >= 2) {

                    }, 500);

                notification.classList.add('bouncing');

                    addNotification(punishNotif, 'hell');

        function spawnEscapeNotification() {
            var phone = document.querySelector('.phone');
            var rect = phone.getBoundingClientRect();

            // Spawn from a random edge of the phone
            var edge = Math.floor(Math.random() * 4);
            var sx, sy;
            switch (edge) {
                case 0: sx = rect.left + Math.random() * rect.width; sy = rect.top + Math.random() * 60; break;
                case 1: sx = rect.right - Math.random() * 50; sy = rect.top + Math.random() * rect.height; break;

                default: sx = rect.left + Math.random() * 50; sy = rect.top + Math.random() * rect.height; break;
            }

            // Trajectory: away from phone center
            var phoneCx = rect.left + rect.width / 2;
            var phoneCy = rect.top + rect.height / 2;
            var angle = Math.atan2(sy - phoneCy, sx - phoneCx) + (Math.random() - 0.5) * 0.8;
            var dist = 220 + Math.random() * 300;
            var ex = Math.cos(angle) * dist;
            var ey = Math.sin(angle) * dist;

            var rot1 = ((Math.random() - 0.5) * 70) + 'deg';
            var rot2 = ((Math.random() - 0.5) * 160) + 'deg';
            var rotEnd = ((Math.random() - 0.5) * 400) + 'deg';

            el.style.top = sy + 'px';
            el.style.setProperty('--ex', ex + 'px');
            el.style.setProperty('--ey', ey + 'px');
            el.style.setProperty('--rot1', rot1);
            el.style.setProperty('--rot2', rot2);

            var bw = noBtn.offsetWidth || 80; var bh = noBtn.offsetHeight || 28;
            noBtn.style.left = (12 + Math.random() * Math.max(10, safeW - bw - 24)) + 'px';
            noBtn.style.top  = (12 + Math.random() * Math.max(10, safeH - bh - 24)) + 'px';
        }

        function trapYes() {
            document.getElementById('trapOverlay').classList.remove('visible');
            if (pendingNextStageCallback) {
                var cb = pendingNextStageCallback;
                pendingNextStageCallback = null;
                setTimeout(cb, 300);
            }
        }

        function trapNo() {
            trapDodgeCount++;
            if (trapDodgeCount >= 8) {
                document.getElementById('trapOverlay').classList.remove('visible');
                showGameOver();
                return;
            }
            showTrapScreen();
        }

        function showGameOver() {
            document.getElementById('transitionOverlay').classList.remove('visible');
            var overlay = document.getElementById('gameoverOverlay');
            var scoreEl = document.getElementById('gameoverScore');
            var startScore = notificationCount * 47 + tapCount * 12; // fake "followers"
            scoreEl.textContent = startScore;
            overlay.classList.add('visible');
            // Rapid countdown to 0
            var interval = setInterval(function() {
                startScore = Math.max(0, startScore - Math.ceil(startScore * 0.18) - 3);
                scoreEl.textContent = startScore;
                if (startScore <= 0) {
                    startScore = 0;
                    scoreEl.textContent = '0';
                    scoreEl.classList.add('zero');
                    clearInterval(interval);
                }
            }, 60);
        }

        function restartExperience() {
            var gameoverEl = document.getElementById('gameoverOverlay');
            gameoverEl.classList.remove('visible');
            document.getElementById('gameoverScore').classList.remove('zero');
            notificationCount = 0;
            stage = 0;
            isHellMode = false;
            tapCount = 0;
            notificationSpeed = 800;
            escapeAttempts = 0;
            warmTapCount = 0;
            easterEggTriggered = false;
            sessionStartTime = null;
            urgentTimers = [];
            var escBtn = document.getElementById('escapeButton');
            escBtn.style.display = 'none';
            escBtn.classList.remove('enabled');
            escBtn.textContent = 'Turn Off Notifications (Disabled)';
            escBtn.style.background = '';
            document.getElementById('tapCounter').style.display = 'none';
            document.getElementById('floodOverlay').style.display = 'none';
            document.querySelector('.screen').classList.remove('warm-stage', 'stress-stage');
            document.querySelector('.screen').style.background = '';
            document.getElementById('counter').textContent = '0';
            document.body.style.background = 'linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%)';
            document.getElementById('contentArea').innerHTML =
                '<div style="text-align: center; color: white; margin-top: 60px; padding: 0 20px;">' +
                '<div style="font-size: 42px; margin-bottom: 12px;">🌸</div>' +
                '<div style="font-size: 22px; font-weight: 700; color: #fff5f5; margin-bottom: 8px; letter-spacing: -0.3px;">Welcome back</div>' +
                '<div style="font-size: 14px; color: rgba(255,200,200,0.75); line-height: 1.6; margin-bottom: 32px; font-weight: 400;">Your friends are here.<br>Something wonderful is waiting.</div>' +
                '<button class="start-button" onclick="startHell()">Open Instagram ✨</button>' +
                '<div style="font-size: 11px; color: rgba(255,180,180,0.45); margin-top: 18px; letter-spacing: 0.3px;">tap to begin</div></div>';
        }

        function startHell() {
            document.getElementById('contentArea').innerHTML = '';
            notificationCount = 0;
            tapCount = 0;
            warmTapCount = 0;
            easterEggTriggered = false;
            sessionStartTime = Date.now();
            stage = 1;

            // Apply warm theme for Stage 1
            document.querySelector('.screen').classList.add('warm-stage');

            document.getElementById('escapeButton').style.display = 'block';
            document.getElementById('tapCounter').style.display = 'block';

            var interval = setInterval(function() {
                if (stage === 1) {
                    var notif = positiveNotifications[Math.floor(Math.random() * positiveNotifications.length)];
                    addNotification(notif, 'warm');

                    if (notificationCount >= 15) {
                        stage = 2;
                        clearInterval(interval);
                        document.querySelector('.screen').classList.remove('warm-stage');
                        // Show transition screen before Stage 2
                        setTimeout(function() {
                            showTransitionScreen('stage1to2', startStage2);
                        }, 1500);
                    }
                }
            }, notificationSpeed);
        }

        function animateStressBackground() {
            var screen = document.querySelector('.screen');
            var startTime = Date.now();
            var duration = 14000; // 14 seconds — warm → cool clinical indigo
            function lerp(a, b, t) { return Math.round(a + (b - a) * t); }
            function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }
            var warmTop    = [45, 27, 46];    // #2d1b2e warm purple (Stage 1)
            var warmBot    = [26, 15, 30];    // #1a0f1e
            var coolTop    = [18, 12, 26];    // #120c1a cool clinical indigo
            var coolBot    = [10, 9,  18];    // #0a0912
            function tick() {
                var elapsed = Date.now() - startTime;
                var t = easeInOut(Math.min(elapsed / duration, 1));
                var r1 = lerp(warmTop[0], coolTop[0], t);
                var g1 = lerp(warmTop[1], coolTop[1], t);
                var b1 = lerp(warmTop[2], coolTop[2], t);
                var r2 = lerp(warmBot[0], coolBot[0], t);
                var g2 = lerp(warmBot[1], coolBot[1], t);
                var b2 = lerp(warmBot[2], coolBot[2], t);
                screen.style.background = 'linear-gradient(180deg, rgb(' + r1 + ',' + g1 + ',' + b1 + ') 0%, rgb(' + r2 + ',' + g2 + ',' + b2 + ') 100%)';
                if (elapsed < duration) requestAnimationFrame(tick);
            }
            requestAnimationFrame(tick);
        }

        function addStage2Notification() {
            var progress = Math.min(Math.max((notificationCount - 15) / 35, 0), 1);
            var rand = Math.random();
            // Positive chance: starts at 25%, fades to 0% by end of Stage 2
            var positiveChance = Math.max(0, 0.28 - progress * 0.35);
            // Anxiety chance: muted, unsettling but not alarming
            var anxietyChance = 0.38;
            if (rand < positiveChance) {
                var notif = positiveNotifications[Math.floor(Math.random() * positiveNotifications.length)];
                addNotification(notif, 'warm');
            } else if (rand < positiveChance + anxietyChance) {
                var notif = anxietyNotifications[Math.floor(Math.random() * anxietyNotifications.length)];
                addNotification(notif, 'anxiety');
            } else {
                addRandomAddictiveNotification();
            }
        }

        function startStage2() {
            var escapeButton = document.getElementById('escapeButton');
            escapeButton.classList.add('enabled');
            escapeButton.textContent = 'Turn Off Notifications';
            animateStressBackground();
            document.querySelector('.screen').classList.add('stress-stage');

            var interval = setInterval(function() {
                if (stage === 2) {
                    addStage2Notification();
                    if (notificationCount >= 50) {
                        stage = 3;
                        clearInterval(interval);
                        // Show transition screen before Stage 3
                        setTimeout(function() {
                            showTransitionScreen('stage2to3', startStage3);
                        }, 1500);
                    }
                }
            }, Math.max(notificationSpeed, 400));
        }

        function startStage3() {
            var interval = setInterval(function() {
                if (stage === 3) {
                    addRandomAddictiveNotification();
                    if (Math.random() < 0.5) {
                        setTimeout(function() { addRandomAddictiveNotification(); }, 200);
                    }
                    if (notificationCount >= 100) {
                        stage = 4;
                        clearInterval(interval);
                        document.querySelector('.screen').classList.remove('stress-stage');
                        // Show transition screen before Hell
                        setTimeout(function() {
                            showTransitionScreen('stage3to4', startHell4);
                        }, 1500);
                    }
                }
            }, Math.max(notificationSpeed, 100));
        }

        function startHell4() {
            isHellMode = true;

            // Notifications escaping the phone — every ~350ms
            setInterval(function() {
                if (isHellMode) {
                    spawnEscapeNotification();
                    if (Math.random() < 0.45) {
                        setTimeout(spawnEscapeNotification, 80);
                    }
                    if (Math.random() < 0.2) {
                        setTimeout(spawnEscapeNotification, 160);
                    }
                }
            }, 350);

            var interval = setInterval(function() {
                var notif = hellNotifications[Math.floor(Math.random() * hellNotifications.length)];
                addNotification(notif, 'hell');
                
                if (notificationCount >= 150) {
                    clearInterval(interval);
                    setTimeout(function() {
                        document.getElementById('floodOverlay').style.display = 'flex';
                    }, 3000);
                }
            }, Math.max(notificationSpeed, 100));
            
            setTimeout(function() {
                setInterval(function() {
                    if (isHellMode) {
                        var notif = hellNotifications[Math.floor(Math.random() * hellNotifications.length)];
                        addNotification(notif, 'hell');
                    }
                }, Math.max(notificationSpeed / 2, 50));
            }, 5000);
        }

        function tryEscape() {
            var button = document.getElementById('escapeButton');
            
            // Only work if button is enabled
            if (!button.classList.contains('enabled')) {
                return;
            }
            
            escapeAttempts++;
            
            if (escapeAttempts === 1) {
                button.textContent = "Turn Off (Not Working?)";
                setTimeout(function() {
                    addNotification({ icon: "😏", text: "Did you really think that would work?", time: "NAIVE" }, 'hell');
                    addNotification({ icon: "🔄", text: "Notifications are now FASTER", time: "ENJOY" }, 'hell');
                }, 500);
                notificationSpeed = Math.max(notificationSpeed / 2, 100);
            } else if (escapeAttempts === 2) {
                button.textContent = "DELETE APP";
                setTimeout(function() {
                    addNotification({ icon: "💥", text: "DELETING MAKES IT WORSE", time: "SURPRISE" }, 'hell');
                    for (var i = 0; i < 5; i++) {
                        setTimeout(function() {
                            var notif = { icon: "👻", text: "WE'RE BACK!", time: "FOREVER" };
                            addNotification(notif, 'hell');
                        }, i * 200);
                    }
                }, 300);
            } else {
                button.textContent = "THERE IS NO ESCAPE";
                button.style.background = "rgba(139, 0, 0, 0.8)";
                setTimeout(function() {
                    addNotification({ icon: "🔒", text: "You tried to escape " + escapeAttempts + " times", time: "PATHETIC" }, 'hell');
                }, 200);
            }
        }

        // ✨ Easter egg functions
        function spawnReflectionNotification() {
            var reflectionNotif = {
                icon: '✨',
                text: 'Something just happened... Tap to see.',
                time: 'only for you'
            };
            var contentArea = document.getElementById('contentArea');
            var notification = document.createElement('div');
            notification.className = 'notification reflection';
            notification.innerHTML =
                '<div class="notification-icon">' + reflectionNotif.icon + '</div>' +
                '<div class="notification-text">' +
                    reflectionNotif.text +
                    '<div class="notification-time">' + reflectionNotif.time + '</div>' +
                '</div>';
            notification.onclick = function() {
                var btnRect = notification.getBoundingClientRect();
                spawnHeartBurst(btnRect.left + btnRect.width / 2, btnRect.top + btnRect.height / 2);
                notification.style.opacity = '0';
                setTimeout(function() {
                    if (notification.parentNode) notification.remove();
                    showReflectionOverlay();
                }, 400);
            };
            contentArea.insertBefore(notification, contentArea.firstChild);
        }

        function showReflectionOverlay() {
            var elapsed = sessionStartTime ? Math.round((Date.now() - sessionStartTime) / 1000) : 0;
            var elapsedStr = elapsed < 60 ? elapsed + 's' : Math.floor(elapsed / 60) + 'm ' + (elapsed % 60) + 's';
            var engagementLevel = tapCount >= 10 ? 'EXCEPTIONAL' : tapCount >= 5 ? 'HIGH' : 'ELEVATED';
            var predictedSession = 17 + Math.floor(Math.random() * 12);

            document.getElementById('reflectionStats').innerHTML =
                '<div class="reflection-stat-row">' +
                    '<span class="reflection-stat-label">Taps so far</span>' +
                    '<span class="reflection-stat-value">' + tapCount + '</span>' +
                '</div>' +
                '<div class="reflection-stat-row">' +
                    '<span class="reflection-stat-label">Time in session</span>' +
                    '<span class="reflection-stat-value">' + elapsedStr + '</span>' +
                '</div>' +
                '<div class="reflection-stat-row">' +
                    '<span class="reflection-stat-label">Engagement level</span>' +
                    '<span class="reflection-stat-value">' + engagementLevel + '</span>' +
                '</div>' +
                '<div class="reflection-stat-row">' +
                    '<span class="reflection-stat-label">Predicted session</span>' +
                    '<span class="reflection-stat-value">~' + predictedSession + ' min</span>' +
                '</div>';

            document.getElementById('reflectionMessage').innerHTML =
                'You tapped ' + tapCount + ' times in ' + elapsedStr + '.<br>' +
                'The algorithm already knows what you like.<br>' +
                'It built this just for you. 💕';

            document.getElementById('reflectionOverlay').classList.add('visible');
        }

        function closeReflectionOverlay() {
            var overlay = document.getElementById('reflectionOverlay');
            overlay.style.opacity = '0';
            overlay.style.transition = 'opacity 0.3s ease';
            setTimeout(function() {
                overlay.classList.remove('visible');
                overlay.style.opacity = '';
                overlay.style.transition = '';
            }, 300);
            // Spawn a celebratory heart burst from center of screen on close
            spawnHeartBurst(window.innerWidth / 2, window.innerHeight / 2);
        }

        setInterval(function() {
            if (isHellMode) {
                var darkColors = ['#0a0a0a', '#1a0a0a', '#2a0a0a', '#0a1a0a', '#0a0a1a', '#1a1a0a', '#1a0a1a', '#0a1a1a', '#2a1a1a'];
                var randomDark = darkColors[Math.floor(Math.random() * darkColors.length)];
                document.body.style.background = 'linear-gradient(135deg, ' + randomDark + ' 0%, #8B0000 100%)';
                setTimeout(function() {
                    document.body.style.background = 'linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%)';
                }, 100);
            }
        }, 2000);
    </script>
