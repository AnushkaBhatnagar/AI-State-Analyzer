<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI State Analyzer - Data-Driven Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            color: #4ec9b0;
            font-size: 24px;
        }
        
        .subtitle {
            color: #858585;
            font-size: 14px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            flex: 1;
            min-height: 0; /* Important for nested scrolling */
        }
        
        .panel {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .panel-header {
            padding: 15px;
            border-bottom: 1px solid #3e3e42;
            background: #2d2d30;
        }
        
        .panel h2 {
            color: #4ec9b0;
            font-size: 16px;
            margin: 0;
        }
        
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        /* State List Styles */
        .state-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .state-button {
            background: #2d2d30;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }
        
        .state-button:hover {
            background: #37373d;
            border-color: #4ec9b0;
        }
        
        .state-button.active {
            background: #094771;
            border-color: #4ec9b0;
            color: #4ec9b0;
        }
        
        .state-id-badge {
            background: #3e3e42;
            color: #d4d4d4;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 8px;
            font-family: monospace;
        }
        
        .state-button.active .state-id-badge {
            background: #1e1e1e;
            color: #4ec9b0;
        }
        
        .state-name {
            font-weight: 600;
            font-size: 14px;
        }
        
        .state-desc {
            font-size: 12px;
            color: #858585;
            margin-top: 4px;
            display: block;
        }
        
        /* Editor Styles */
        .editor-layout {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100%;
        }
        
        .editor-toolbar {
            padding: 10px 15px;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
        }
        
        .state-metadata {
            background: #1e1e1e;
            border-bottom: 1px solid #3e3e42;
            padding: 15px;
            font-size: 13px;
        }
        
        .metadata-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .metadata-item label {
            display: block;
            color: #569cd6;
            margin-bottom: 4px;
            font-size: 11px;
            text-transform: uppercase;
        }
        
        .metadata-value {
            color: #ce9178;
            font-family: 'Courier New', monospace;
            background: #2d2d30;
            padding: 4px 8px;
            border-radius: 4px;
        }
        
        textarea {
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 15px;
            font-family: 'Courier New', Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: none;
        }
        
        textarea:focus {
            outline: none;
        }
        
        /* Buttons */
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #1177bb;
        }
        
        button:disabled {
            background: #3e3e42;
            color: #858585;
            cursor: not-allowed;
        }
        
        /* Status Message */
        .status-bar {
            padding: 8px 15px;
            background: #007acc;
            color: white;
            font-size: 12px;
            display: none;
        }
        
        .status-bar.show {
            display: block;
        }
        
        .status-bar.error {
            background: #c72e0f;
        }
        
        .status-bar.success {
            background: #16825d;
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #858585;
            text-align: center;
        }
        
        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #d4d4d4;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🎨 Data-Driven State Editor</h1>
                <div class="subtitle">Dynamically loaded from <code>states_schema.json</code></div>
            </div>
            <div id="connectionStatus" style="color: #4ec9b0; font-size: 12px;">Connecting...</div>
        </header>
        
        <div class="grid">
            <!-- Left Panel: State List -->
            <div class="panel">
                <div class="panel-header">
                    <h2>📋 Available States</h2>
                </div>
                <div class="scrollable-content">
                    <div id="stateList" class="state-list">
                        <div style="text-align: center; color: #858585; padding: 20px;">
                            Loading states...
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Right Panel: Editor -->
            <div class="panel">
                <div id="editorContent" class="editor-layout" style="display: none;">
                    <div class="editor-toolbar">
                        <div id="selectedStateTitle" style="font-weight: 600;">State Name</div>
                        <button onclick="saveChanges()" id="saveBtn">💾 Save Changes</button>
                    </div>
                    
                    <div class="state-metadata">
                        <div class="metadata-grid">
                            <div class="metadata-item">
                                <label>Description</label>
                                <div id="metaDescription" style="color: #d4d4d4;">-</div>
                            </div>
                            <div class="metadata-item">
                                <label>Range Description</label>
                                <div id="metaRange" style="color: #d4d4d4;">-</div>
                            </div>
                            <div class="metadata-item">
                                <label>Detection Condition</label>
                                <div id="metaDetection" class="metadata-value">...</div>
                            </div>
                            <div class="metadata-item">
                                <label>Functions Found</label>
                                <div id="metaFunctions" class="metadata-value">Scanning...</div>
                            </div>
                        </div>
                    </div>
                    
                    <div style="flex: 1; position: relative;">
                        <textarea id="codeEditor" spellcheck="false"></textarea>
                    </div>
                    
                    <div id="statusBar" class="status-bar">Ready</div>
                </div>
                
                <div id="emptyState" class="empty-state">
                    <h3>Select a state to edit</h3>
                    <p>Code will be dynamically extracted based on the schema.</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let currentStateId = null;
        let originalCode = '';
        
        // Initialize
        async function init() {
            try {
                const response = await fetch('/api/states');
                const data = await response.json();
                
                if (data.success) {
                    renderStateList(data.states);
                    document.getElementById('connectionStatus').textContent = `✅ Connected (${data.states.length} states loaded)`;
                } else {
                    showStatus('Error loading states: ' + data.error, 'error');
                }
            } catch (error) {
                console.error(error);
                document.getElementById('connectionStatus').textContent = '❌ Connection Failed';
                document.getElementById('stateList').innerHTML = `
                    <div style="color: #f48714; padding: 20px; text-align: center;">
                        Could not connect to server.<br>
                        Make sure <code>server-enhanced-new.py</code> is running.
                    </div>
                `;
            }
        }
        
        // Render the list of states
        function renderStateList(states) {
            const list = document.getElementById('stateList');
            list.innerHTML = '';
            
            states.forEach(state => {
                const btn = document.createElement('div');
                btn.className = 'state-button';
                btn.innerHTML = `
                    <span class="state-id-badge">ID: ${state.id}</span>
                    <span class="state-name">${state.name}</span>
                    <span class="state-desc">${state.description}</span>
                `;
                btn.onclick = () => loadState(state.id);
                btn.dataset.id = state.id; // Store ID for active state highlighting
                list.appendChild(btn);
            });
        }
        
        // Load a specific state
        async function loadState(id) {
            currentStateId = id;
            
            // UI Updates
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('editorContent').style.display = 'grid'; // Grid layout
            
            // Highlight active button
            document.querySelectorAll('.state-button').forEach(b => b.classList.remove('active'));
            const activeBtn = document.querySelector(`.state-button[data-id="${id}"]`);
            if (activeBtn) activeBtn.classList.add('active');
            
            showStatus('Loading code...', 'info');
            document.getElementById('codeEditor').value = 'Loading...';
            
            try {
                const response = await fetch(`/api/state/${id}/code`);
                const data = await response.json();
                
                if (data.success) {
                    // Fill Metadata
                    const state = data.state;
                    document.getElementById('selectedStateTitle').textContent = `${state.name} (ID: ${state.id})`;
                    document.getElementById('metaDescription').textContent = state.description;
                    document.getElementById('metaRange').textContent = state.range_description;
                    document.getElementById('metaDetection').textContent = state.detection_condition;
                    
                    const funcs = data.extracted_functions.map(f => f.name).join(', ');
                    document.getElementById('metaFunctions').textContent = funcs || 'None found (showing full snippet)';
                    
                    // Set Code
                    originalCode = data.code.full_code;
                    document.getElementById('codeEditor').value = originalCode;
                    
                    showStatus('Loaded successfully', 'success');
                } else {
                    showStatus('Error: ' + data.error, 'error');
                }
            } catch (error) {
                showStatus('Error loading state code: ' + error.message, 'error');
            }
        }
        
        // Save changes
        async function saveChanges() {
            if (currentStateId === null) return;
            
            const newCode = document.getElementById('codeEditor').value;
            
            if (newCode === originalCode) {
                showStatus('No changes detected', 'info');
                return;
            }
            
            showStatus('Saving...', 'info');
            
            try {
                const response = await fetch(`/api/state/${currentStateId}/save`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code: newCode,
                        changes: ['User modified code via Data-Driven Editor']
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showStatus('✅ Saved! Ask Cline to apply changes.', 'success');
                    originalCode = newCode;
                } else {
                    showStatus('Error saving: ' + data.error, 'error');
                }
            } catch (error) {
                showStatus('Error saving: ' + error.message, 'error');
            }
        }
        
        function showStatus(msg, type) {
            const el = document.getElementById('statusBar');
            el.textContent = msg;
            el.className = `status-bar show ${type}`;
            
            if (type === 'success') {
                setTimeout(() => {
                    el.className = 'status-bar';
                }, 3000);
            }
        }
        
        // Start
        init();
    </script>
</body>
</html>
